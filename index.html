<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CODE AI</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <header class="topbar">

    <div class="logo">
      ⚡ CODE <span>AI</span>
    </div>

    <div class="top-buttons">

      <button
        id="websiteTab"
        class="top-btn active"
      >
        🌐 Website AI
      </button>

      <button
        id="videoTab"
        class="top-btn"
      >
        🎬 Image → Video
      </button>

    </div>

  </header>


  <!-- WEBSITE BUILDER -->

  <main
    id="websiteSection"
    class="section"
  >

    <div class="page-title">
      🤖 AI Website Builder
    </div>

    <div class="builder">

      <section class="chat-panel">

        <div class="panel-title">
          🤖 CODE AI
        </div>

        <div
          id="chat"
          class="chat"
        >

          <div class="ai-message">
            👋 Hello! Mujhe batao tumhe
            kaunsi website chahiye.
          </div>

        </div>

        <div class="input-area">

          <textarea
            id="prompt"
            placeholder="Example: mujhe ek modern gaming website bana ke do..."
          ></textarea>

          <button
            id="generateBtn"
            class="generate-btn"
          >
            🚀 Generate Website
          </button>

        </div>

      </section>


      <section class="preview-panel">

        <div class="panel-title">
          🌐 Live Preview
        </div>

        <iframe
          id="preview"
          title="Website Preview"
        ></iframe>

      </section>


      <section class="code-panel">

        <div class="panel-title">
          💻 Generated Code
        </div>

        <div class="code-tabs">

          <button
            class="code-tab active"
            data-code="html"
          >
            HTML
          </button>

          <button
            class="code-tab"
            data-code="css"
          >
            CSS
          </button>

          <button
            class="code-tab"
            data-code="js"
          >
            JavaScript
          </button>

        </div>

        <pre
          id="codeOutput"
        >No code generated yet.</pre>

      </section>

    </div>

  </main>


  <!-- VIDEO BUILDER -->

  <main
    id="videoSection"
    class="section hidden"
  >

    <div class="page-title">
      🎬 AI Image → Video
    </div>

    <div class="video-builder">

      <div class="upload-card">

        <h2>
          📷 Upload Your Image
        </h2>

        <div
          id="dropArea"
          class="drop-area"
        >

          <div
            id="uploadText"
          >
            📷 Click to upload image
          </div>

          <input
            type="file"
            id="imageInput"
            accept="image/png,image/jpeg,image/webp"
            hidden
          >

        </div>

        <img
          id="imagePreview"
          class="image-preview hidden"
          alt="Preview"
        >

      </div>


      <div class="video-settings">

        <h2>
          🎬 Video Settings
        </h2>

        <label>
          Describe your video
        </label>

        <textarea
          id="videoPrompt"
          placeholder="Example: person slowly walks toward the camera, cinematic camera movement, realistic motion, wind moving clothes..."
        ></textarea>

        <label>
          Video Ratio
        </label>

        <select
          id="aspectRatio"
        >
          <option value="9:16">
            9:16 Portrait
          </option>

          <option value="16:9">
            16:9 Landscape
          </option>
        </select>

        <button
          id="videoBtn"
          class="video-btn"
        >
          🚀 Generate Video
        </button>

        <div
          id="videoStatus"
          class="video-status"
        ></div>

      </div>


      <div class="result-card">

        <h2>
          🎥 Generated Video
        </h2>

        <div
          id="videoResult"
          class="video-result"
        >
          Video yahan show hoga.
        </div>

      </div>

    </div>

  </main>


  <script src="app.js"></script>

</body>

</html>
